<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Concepts | Space Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="concepts.css">
  <link rel="icon" href="images/tabImg.png" type="tabImg.png">

</head>

<body>


  <header>
    <a href="index.html" class="logo"><img src="images/logo.png" alt="logo"></a>
  </header>


  <main class="concepts-container">
    <h1 class="page-title">Cosmic Concepts</h1>
    <p class="page-subtitle">Select a concept to unlock key insights about our universe</p>

    <div class="glossary-grid">

      <div class="concepts-list" id="conceptsList"></div>

      <div class="display-card" id="displayCard">
        <div>
          <img id="conceptImg" class="concept-image" src="" alt="Space Concept">
          <h2 id="conceptTitle" class="card-title"></h2>
          <div id="conceptTagline" class="card-tagline"></div>
          <p id="conceptDesc" class="card-description"></p>
        </div>
        <div id="conceptFact" class="fact-box"></div>
      </div>
    </div>
  </main>


  <script src="concepts.js"></script>
</body>

</html>
